name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # A scrape from outside the host, reading metrics only a running
      # exporter could have collected.
      - name: Scrape the metrics, and again after a restart
        run: |
          scrape() {
            curl -fsS --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 -o metrics.txt http://127.0.0.1:9100/metrics
            grep -q '^node_exporter_build_info{' metrics.txt
            grep -q '^node_cpu_seconds_total{' metrics.txt
            grep -q '^node_memory_MemTotal_bytes ' metrics.txt
          }
          scrape
          podman exec circuit-node-exporter systemctl restart node_exporter
          scrape
      # A fresh host gets the previous release, then the circuit's own pin is
      # applied over it, the way someone raises node_exporter_version.
      - name: Upgrade from node_exporter 1.12.0 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: |
          scrape() {
            curl -fsS --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 -o metrics.txt http://127.0.0.1:9100/metrics
            grep -q '^node_cpu_seconds_total{' metrics.txt
            grep -q "^node_exporter_build_info{.*version=\"$1\"" metrics.txt
          }
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var node_exporter_version=1.12.0 \
            -var 'checksums={amd64="b206d98e98a431f2687d4c217abb4b15c46a6b272896113ce9a1585cf1a75d1f",arm64="4ea211ce95224acb7f7c932693cb25f91f7fbe202c86bf6dc943c8569b3f6bac"}'
          scrape 1.12.0
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          scrape "$(sed -n '/variable "node_exporter_version"/,/}/s/^ *default *= *"\(.*\)"/\1/p' ../../variables.tf)"
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
